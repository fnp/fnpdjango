[tox]
envlist=clear,
    d{22,30,31}-py{38,39},
    d{32,40}-py{38,39,310},
    d41-py{38,39,310,311},
    d42-py{38,39,310,311,312},
    d50-py{310,311,312},
    d51-py{310,311,312,313},
    d52-py{310,311,312,313,314},
    d60-py{312,313,314},
    d61-py{312,313,314,315},
    stats

[testenv]
commands=coverage run --source=fnpdjango --append --branch runtests.py
deps=
    d22: Django>=2.2,<3.0
    d30: Django>=3.0,<3.1
    d31: Django>=3.1,<3.2
    d32: Django>=3.2,<4.0
    d40: Django>=4.0,<4.1
    d41: Django~=4.1.0
    d42: Django~=4.2.0
    d50: Django~=5.0.0
    d51: Django~=5.1.0
    d52: Django~=5.2.0
    d60: Django~=6.0.0
    d61: Django~=6.1.0
    coverage
extras=textile,pipeline

[testenv:clear]
basepython=python3
commands=coverage erase

[testenv:stats]
basepython=python3
commands=coverage html

